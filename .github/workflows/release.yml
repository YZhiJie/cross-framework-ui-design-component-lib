name: Release

# CI 成功后才触发 Release，避免每次 push 重复执行
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # 仅在 CI 成功时执行（跳过失败/取消的 CI run）
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段决定

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 发布前再跑一遍门禁，防止 CI → release 间隙有意外变动
      - name: 统一门禁
        run: pnpm gate

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # 注意：不要用 `pnpm changeset publish` —— changeset 3.x 内部用
          # Promise.all 并发 publish 所有包，npm registry 在高并发写入时会
          # 返回瞬时 E404（shared/styles 先撞上 404，后续依赖它们的包全挂）。
          # 改用 pnpm -r publish，pnpm 会按 workspace 拓扑序**顺序**发布，
          # 天然规避竞态；同时 workspace:* 依赖在 publish 时自动 rewrite。
          publish: pnpm -r publish --access public --no-git-checks --filter '!@xui-design/playground-*' --filter '!@xui-design/docs' --filter '!@xui-design/utils'
          version: pnpm changeset version
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
